services:
  web:
    build: .
    image: forensys-web:local
    container_name: forensys-web
    ports:
      # port di kiri = port VM/laptop, port di kanan = port di dalam container
      - "0.0.0.0:${APP_PORT:-80}:8080"
    env_file: .env
    environment:
      AUTORUN_ENABLED: "true"   # jalankan migrasi otomatis saat container start
      DB_HOST: db               # Laravel menghubungi database lewat nama service
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public_net
      - private_net

  db:
    image: mysql:8.4
    container_name: forensys-db
    # tidak ada "ports:" -> database tidak terbuka ke publik
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - forensys_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - private_net

networks:
  public_net:
  private_net:
    internal: true   # jaringan tertutup: hanya antar-container

volumes:
  forensys_db_data:
